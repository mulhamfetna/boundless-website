baseURL = "https://boundlessacademic.com/"
title = "Boundless Academic Services"
theme = "boundless"

# Arabic is the primary language, served at the site root; English lives under /en/.
# Superseded spec decision D1 on 2026-10-23 (see the decision log in the design spec).
defaultContentLanguage = "ar"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableGitInfo = false
summaryLength = 30

[taxonomies]
  tag = "tags"

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
